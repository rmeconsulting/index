<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutlu | Executive Search & Headhunter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 50px 35px;
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
        }
        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            color: #60a5fa;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .description {
            color: #9ca3af;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111827;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s ease;
        }
        .btn:hover {
            background: #3b82f6;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <!-- Logonuzun linkini buraya koyacağız -->
            <img src="LOGONUZUN_INTERNET_LINKI" alt="Logo">
        </div>
        
        <h1>Mutlu</h1>
        <div class="subtitle">Strategic Talent Advisory</div>
        
        <p class="description">
            Kritik pozisyonlar ve üst düzey yönetim kadroları için nokta atışı yetenek çözümleri sunuyorum. Şirketlerin geleceğini şekillendirecek doğru liderleri ve uzmanları gizlilik prensibiyle bulup organizasyonunuza kazandırıyorum.
        </p>

        <!-- Kendi LinkedIn Profil Linkinizi buraya yapıştırın -->
        <a href="LINKEDIN_PROFIL_LINKINIZ" target="_blank" class="btn">
            LinkedIn Üzerinden İletişime Geçin
        </a>
    </div>

</body>
</html>
